services:
  - type: web
    name: uniride
    runtime: python
    plan: free
    buildCommand: npm ci --prefix frontend && npm run build --prefix frontend && pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: uniride-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_REGISTER_CODE
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60

databases:
  - name: uniride-db
    plan: free
