services:
  - type: web
    name: uniride
    runtime: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt && npm install --include=dev --prefix frontend && npm run build --prefix frontend
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: ADMIN_SECRET_CODE
        sync: false
      - key: CORS_ORIGINS
        sync: false
